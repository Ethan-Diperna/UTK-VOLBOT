<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UTK Catalog Assistant (unofficial)</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>UTK Catalog Assistant</h1>
    </header>

    <form id="ask-form" autocomplete="off">
      <label class="visually-hidden" for="question">Your question</label>
      <textarea id="question" name="question" rows="2" maxlength="500" required
                placeholder="EX: What are the prerequisites for COSC 360?"></textarea>
      <div class="form-row">
        <button id="send" type="submit">Ask</button>
      </div>
    </form>

    <div id="examples" class="chips" aria-label="Example questions">
      <button type="button" class="chip">What are the prerequisites for COSC 360?</button>
      <button type="button" class="chip">How many credit hours is MATH 251?</button>
      <button type="button" class="chip">Does the Applied AI major have a capstone?</button>
    </div>

    <p id="status" role="status" aria-live="polite" hidden></p>

    <article id="result" hidden>
      <div id="answer"></div>
      <details id="sources-panel">
        <summary>Sources <span id="source-count"></span></summary>
        <ol id="sources"></ol>
        <details id="other-sources-panel" class="other-sources">
          <summary>Other excerpts that were searched <span id="other-source-count"></span></summary>
          <ul id="other-sources"></ul>
        </details>
      </details>
      <p id="meta" class="meta"></p>
    </article>

    <footer>
      <p>Unofficial student project, not affiliated with or endorsed by the University of Tennessee.
        The catalog does not list instructors, class times or tuition. Confirm anything important with
        your advisor before you register.</p>
    </footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
